<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>裴溯語意驗證器 v1 測試</title>
<style>
body{font-family:system-ui,-apple-system,sans-serif;max-width:760px;margin:auto;padding:18px;background:#f6f7f9;color:#222}
h1{font-size:22px}.card{background:white;border-radius:14px;padding:15px;margin:12px 0;box-shadow:0 2px 10px #0001}
textarea{width:100%;box-sizing:border-box;min-height:230px;padding:10px;font-family:monospace;font-size:13px}
button{width:100%;padding:13px;border:0;border-radius:10px;font-size:16px;background:#222;color:white}
pre{white-space:pre-wrap;word-break:break-word;background:#f1f3f5;padding:12px;border-radius:10px;min-height:60px}
.small{font-size:13px;color:#666}
</style>
</head>
<body>
<h1>裴溯語意驗證器 v1｜獨立測試</h1>
<div class="card">
<div class="small">把 nano r4 輸出的完整 JSON 貼在下面。此頁只測驗證器，不會呼叫 OpenAI，也不會改動 nano r4。</div>
<textarea id="semantic" placeholder='貼上 nano r4 JSON'></textarea>
<button id="go">送去驗證</button>
</div>
<div class="card">
<b>驗證結果</b>
<pre id="out">尚未測試</pre>
</div>
<script>
const ENDPOINT="https://peisu-semantic-validator-v1.a0982227546.workers.dev";
document.getElementById("go").onclick=async()=>{
 const out=document.getElementById("out");
 try{
  const raw=document.getElementById("semantic").value.trim();
  if(!raw) throw new Error("請先貼上 nano r4 JSON");
  const semantic=JSON.parse(raw);
  out.textContent="驗證中…";
  const r=await fetch(ENDPOINT,{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify(semantic)
  });
  const text=await r.text();
  let shown=text;
  try{shown=JSON.stringify(JSON.parse(text),null,2)}catch{}
  out.textContent=(r.ok?"":"HTTP "+r.status+"\n")+shown;
 }catch(e){out.textContent="錯誤："+e.message}
};
</script>
</body>
</html>
