<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>場景＋動作權限判斷測試層 v0.4</title><style>body{font-family:system-ui,sans-serif;max-width:760px;margin:auto;padding:24px;background:#f7f7f7;color:#222}h1{font-size:1.55rem}label{font-weight:700;display:block;margin:18px 0 8px}input,textarea,button,pre{box-sizing:border-box;width:100%;font:inherit}input,textarea{padding:12px;border:1px solid #bbb;border-radius:12px;background:#fff}textarea{min-height:210px}button{margin-top:18px;padding:14px;border:0;border-radius:12px;font-weight:700}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#fff;padding:14px;border:1px solid #ddd;border-radius:12px}.note{color:#666;line-height:1.55}</style></head><body><h1>場景＋動作權限判斷測試層 v0.4</h1><p class="note">獨立測試；只判斷場景延續、場景切換、可用物件與動作權限，不產生裴溯台詞，也不修改既有 Semantic / Validator / Reviewer / Reply v1.2。</p><label>測試 Worker endpoint</label><input id="endpoint" placeholder="https://peisu-scene-action-test-v04....workers.dev"><label>原始對話</label><textarea id="conversation"></textarea><button id="run">開始測試</button><h2>判斷結果</h2><pre id="result">尚未測試</pre><script>const e=document.getElementById("endpoint"),c=document.getElementById("conversation"),r=document.getElementById("result");document.getElementById("run").onclick=async()=>{r.textContent="測試中…";let u=e.value.trim();if(u&&!/^https?:\/\//i.test(u))u="https://"+u;try{const x=await fetch(u,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({conversation:c.value})});const q=await x.text();try{r.textContent=JSON.stringify(JSON.parse(q),null,2)}catch{r.textContent=q}}catch(err){r.textContent="錯誤："+err}};</script></body></html>
