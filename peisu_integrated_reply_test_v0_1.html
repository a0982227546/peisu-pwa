<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>裴溯｜整合回覆測試 v0.1</title><style>body{font-family:system-ui,sans-serif;max-width:760px;margin:auto;padding:20px;background:#f6f7f9;color:#222}h1{font-size:1.5rem}.c{background:#fff;padding:15px;border-radius:14px;margin:12px 0}input,textarea,button,pre{box-sizing:border-box;width:100%;font:inherit}input,textarea{padding:11px;border:1px solid #bbb;border-radius:10px}textarea{min-height:210px}button{margin-top:12px;padding:13px;border:0;border-radius:10px;font-weight:700}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f1f3f5;padding:12px;border-radius:10px}.s{font-size:13px;color:#666}</style></head><body><h1>裴溯｜整合回覆測試 v0.1</h1><p class="s">原始對話 → Semantic RETRY → 場景＋動作 v0.5 → 整合回覆。既有確認版本不修改。</p><div class="c"><label>整合測試 Worker endpoint</label><input id="e"><label>原始對話</label><textarea id="q">我坐在沙發上。\n裴溯坐在我旁邊。\n我把頭靠到他肩膀上。</textarea><button id="go">開始測試</button></div><div class="c"><h2>裴溯實際輸出</h2><pre id="o">尚未測試</pre></div><div class="c"><h2>完整判斷結果</h2><pre id="d">尚未測試</pre></div><script>go.onclick=async()=>{go.disabled=true;o.textContent=d.textContent="測試中…";let u=e.value.trim();if(u&&!/^https?:\/\//i.test(u))u="https://"+u;try{const r=await fetch(u,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({conversation:q.value.trim()})});const t=await r.text();let x;try{x=JSON.parse(t)}catch{throw new Error(t)}if(!r.ok)throw new Error(JSON.stringify(x,null,2));const z=x.integrated_reply?.reply||{};let s=z.mode==="silent"?"（裴溯沒有發送訊息）":(z.text||"（空白回覆）");if(z.action?.type==="physical_action"&&z.action.description)s+="\n\n【動作】"+z.action.description;o.textContent=s;d.textContent=JSON.stringify(x,null,2)}catch(err){o.textContent="錯誤："+err.message;d.textContent=String(err.stack||err)}finally{go.disabled=false}};</script></body></html>
