<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>裴溯人格／語言測試 v0.2</title><style>body{font-family:system-ui,sans-serif;max-width:760px;margin:auto;padding:18px;background:#111;color:#eee}textarea,input,button,pre{box-sizing:border-box;width:100%;font:inherit}input,textarea{background:#1d1d1d;color:#fff;border:1px solid #555;border-radius:10px;padding:12px}textarea{min-height:210px;margin-top:10px}button{margin-top:10px;padding:13px;border:0;border-radius:10px}pre{white-space:pre-wrap;word-break:break-word;background:#1b1b1b;padding:12px;border-radius:10px;min-height:120px}.hint{color:#aaa;font-size:14px}</style></head><body><h2>裴溯人格／語言測試 v0.2</h2><p class="hint">獨立測試版：沿用已凍結的 Semantic + Scene/Action，只更換人格／語言規格。</p><label>Worker 網址</label><input id="url" placeholder="https://peisu-integrated-reply-voice-test-v02....workers.dev"><textarea id="c" placeholder="貼上完整測試情境"></textarea><button id="go">送出測試</button><pre id="out">等待測試</pre><script>go.onclick=async()=>{out.textContent='測試中…';try{const r=await fetch(url.value.trim(),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({conversation:c.value})});out.textContent=JSON.stringify(await r.json(),null,2)}catch(e){out.textContent=String(e)}}</script></body></html>
