<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>裴溯人格／語言測試 v0.3</title><style>body{font-family:system-ui,sans-serif;max-width:760px;margin:auto;padding:18px;background:#111;color:#eee}textarea,input,button,pre{box-sizing:border-box;width:100%;font:inherit}input,textarea{background:#1d1d1d;color:#fff;border:1px solid #555;border-radius:10px;padding:12px}textarea{min-height:210px;margin-top:10px}button{margin-top:10px;padding:13px;border:0;border-radius:10px}.reply{margin-top:14px;background:#f2f2f2;color:#111;border-radius:12px;padding:14px;min-height:54px}.reply b{display:block;margin-bottom:6px}pre{white-space:pre-wrap;word-break:break-word;background:#1b1b1b;padding:12px;border-radius:10px;min-height:120px}.hint{color:#aaa;font-size:14px}</style></head><body><h2>裴溯人格／語言測試 v0.3</h2><p class="hint">獨立回歸測試：沿用已凍結的 Semantic + Scene/Action，只修改人格／回覆決策。上方直接顯示裴溯台詞，下方保留完整 JSON。</p><label>Worker 網址</label><input id="url" placeholder="https://peisu-integrated-reply-voice-test-v03....workers.dev"><textarea id="c" placeholder="貼上完整測試情境"></textarea><button id="go">送出測試</button><div class="reply"><b>裴溯</b><span id="reply">等待測試</span></div><pre id="out">等待測試</pre><script>go.onclick=async()=>{reply.textContent='測試中…';out.textContent='測試中…';try{const r=await fetch(url.value.trim(),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({conversation:c.value})});const data=await r.json();const x=data?.integrated_reply?.reply;if(x){reply.textContent=x.mode==='silent'?'（沉默）':(x.text||'（無文字）')}else{reply.textContent='未取得裴溯回覆'}out.textContent=JSON.stringify(data,null,2)}catch(e){reply.textContent='測試失敗';out.textContent=String(e)}}</script></body></html>
