<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>場景＋動作權限判斷測試層 v0.5.1</title><style>body{font-family:system-ui,sans-serif;max-width:760px;margin:auto;padding:24px;background:#f7f7f7;color:#222}h1{font-size:1.55rem}label{font-weight:700;display:block;margin:18px 0 8px}textarea,button,pre{box-sizing:border-box;width:100%;font:inherit}textarea{padding:12px;border:1px solid #bbb;border-radius:12px;background:#fff;min-height:210px}button{margin-top:18px;padding:14px;border:0;border-radius:12px;font-weight:700}button:disabled{opacity:.55}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#fff;padding:14px;border:1px solid #ddd;border-radius:12px}.note{color:#666;line-height:1.55}</style></head><body><h1>場景＋動作權限判斷測試層 v0.5.1</h1><p class="note">獨立測試；固定送往 v0.5.1 Worker。每按一次「開始測試」才會送出一次 POST。</p><label for="conversation">原始對話</label><textarea id="conversation"></textarea><button id="run" type="button">開始測試</button><h2>判斷結果</h2><pre id="result">尚未測試</pre><script>(()=>{const ENDPOINT="https://peisu-scene-action-test-v05.a0982227546.workers.dev";const c=document.getElementById("conversation"),r=document.getElementById("result"),b=document.getElementById("run");b.addEventListener("click",async(ev)=>{ev.preventDefault();ev.stopPropagation();const conversation=c.value.trim();if(!conversation){r.textContent="請先輸入原始對話。";return}b.disabled=true;r.textContent="測試中…";try{const x=await fetch(ENDPOINT,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({conversation})});const q=await x.text();let shown=q;try{shown=JSON.stringify(JSON.parse(q),null,2)}catch{}r.textContent=shown}catch(err){r.textContent="錯誤："+(err?.message||err)}finally{b.disabled=false}})})();</script></body></html>
