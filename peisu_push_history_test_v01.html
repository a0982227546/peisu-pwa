<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#11161e">
<meta name="application-name" content="裴總休息中">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="裴總休息中">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>裴總休息中</title>
<style>
:root{color-scheme:dark;--body:#090c11;--app:#11161e;--text:#eef1f5;--border:#2d3541;--pei:#222a35;--me:#3b475a;--meta:#778291;--input:#202731;--ib:#414b59;--button:#252d38}
body.light{color-scheme:light;--body:#f3f3f3;--app:#fff;--text:#111;--border:#ddd;--pei:#fff;--me:#fff;--meta:#777;--input:#fff;--ib:#ccc;--button:#fff}
*{box-sizing:border-box}
body{margin:0;background:var(--body);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif}
.app{max-width:640px;height:100dvh;margin:auto;display:flex;flex-direction:column;background:var(--app)}
.head{padding:12px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}.head b{font-size:17px}
.theme{background:var(--button);color:var(--text);border:1px solid var(--ib);border-radius:9px;padding:8px 10px;min-width:58px;font:inherit}
.chat{flex:1;overflow:auto;padding:14px}
.row{display:flex;width:100%;margin:10px 0}.row.pei{justify-content:flex-start}.row.me{justify-content:flex-end}
.group{display:flex;flex-direction:column;min-width:0;max-width:min(64%,400px)}.pei .group{align-items:flex-start}.me .group{align-items:flex-end}
.bubble{display:inline-block;width:auto;max-width:100%;box-sizing:border-box;padding:10px 11px;border-radius:18px;background:var(--pei);font-size:16px;line-height:1.42;text-align:left;white-space:pre-wrap;word-break:break-all;overflow-wrap:anywhere;line-break:anywhere}
.me .bubble{background:var(--me)}body.light .bubble{border:1px solid #ddd}
.meta{font-size:10px;color:var(--meta);margin-top:4px}
.status{min-height:22px;padding:3px 14px;color:var(--meta);font-size:12px}
.input{display:flex;gap:8px;padding:10px;padding-bottom:max(10px,env(safe-area-inset-bottom));border-top:1px solid var(--border)}
.input textarea{flex:1;min-height:52px;max-height:140px;resize:vertical;background:var(--input);color:var(--text);border:1px solid var(--ib);border-radius:11px;padding:10px;font:inherit}
.send{background:var(--button);color:var(--text);border:1px solid var(--ib);border-radius:9px;padding:8px 10px;min-width:58px;font:inherit}.send:disabled{opacity:.45}

/* UI integration only — locked v07 bubble rules above are untouched */
.head-actions{display:flex;align-items:center;gap:3px}
.theme{padding:3px 6px;min-width:38px;font-size:13px}
.more{background:transparent;color:var(--text);border:0;padding:1px 4px;font:inherit;font-size:16px;line-height:1}
.menu{position:fixed;z-index:30;min-width:150px;background:var(--app);border:1px solid var(--border);border-radius:12px;padding:5px;box-shadow:0 8px 24px #0006}
.menu[hidden],.memory-view[hidden],.history-view[hidden]{display:none}
.menu button{display:block;width:100%;border:0;background:transparent;color:var(--text);font:inherit;text-align:left;padding:10px 12px;border-radius:8px}
.memory-view{position:fixed;inset:0;z-index:40;background:var(--app);color:var(--text);display:flex;flex-direction:column}
.memory-head{padding:12px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.memory-head button{border:0;background:transparent;color:var(--text);font:inherit;font-size:22px;padding:2px 6px}
.memory-list{flex:1;overflow:auto;padding:14px}
.memory-item{padding:10px 0;border-bottom:1px solid var(--border)}
.memory-time{font-size:10px;color:var(--meta);margin-bottom:4px}
.memory-empty{color:var(--meta);font-size:13px}
.memory-remove{margin-top:8px;border:1px solid var(--ib);background:var(--button);color:var(--text);border-radius:8px;padding:6px 9px;font:inherit;font-size:12px}
.date-sep{display:flex;align-items:center;justify-content:center;margin:18px 0 8px;color:var(--meta);font-size:12px;text-align:center}
.history-view{position:fixed;inset:0;z-index:40;background:var(--app);color:var(--text);display:flex;flex-direction:column}
.history-head{padding:12px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.history-head button{border:0;background:transparent;color:var(--text);font:inherit;font-size:22px;padding:2px 6px}
.history-list{flex:1;overflow:auto;padding:14px}
.history-day{padding:10px 0 14px;border-bottom:1px solid var(--border)}
.history-day-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px}
.history-day-title{font-size:14px;font-weight:600}
.history-delete{border:1px solid var(--ib);background:var(--button);color:var(--text);border-radius:8px;padding:6px 9px;font:inherit;font-size:12px;white-space:nowrap}
.history-line{font-size:13px;line-height:1.45;margin:5px 0;white-space:pre-wrap;overflow-wrap:anywhere}
.history-line-time{color:var(--meta);font-size:10px;margin-right:6px}
.history-empty{color:var(--meta);font-size:13px}

.context-debug{margin:0 14px 8px;padding:8px 10px;border:1px dashed var(--ib);border-radius:9px;color:var(--meta);font-size:12px;line-height:1.45;white-space:pre-wrap}
.context-debug[hidden]{display:none}

/* official v1: development-only controls are not shown */
#contextDebug,#testNextDay,#clearDateTest{display:none !important}
</style></head>
<body><div class="app">
<div class="head"><b>裴溯</b><div class="head-actions"><button class="theme" id="theme">白</button><button class="more" id="more" aria-label="更多">⋯</button></div></div>
<div class="chat" id="chat"></div>
<div class="status" id="status"></div>
<div class="context-debug" id="contextDebug" hidden></div>
<div class="input"><textarea id="inp"></textarea><button class="send" id="send">送出</button></div>
</div>
<div class="menu" id="topMenu" hidden><button id="openMemory">長期記憶</button><button id="openHistory">聊天紀錄</button><button id="testNextDay">跨日測試</button><button id="clearDateTest">移除跨日測試</button></div>
<div class="menu" id="msgMenu" hidden><button id="copyMsg">複製</button><button id="toggleMemory">加入長期記憶</button></div>

<div class="memory-view" id="memoryView" hidden><div class="memory-head"><button id="closeMemory">‹</button><b>長期記憶</b></div><div class="memory-list" id="memoryList"></div></div>
<div class="history-view" id="historyView" hidden><div class="history-head"><button id="closeHistory">‹</button><b>聊天紀錄</b></div><div class="history-list" id="historyList"></div></div>
<script>
const WORKER_URL="https://peisu-integrated-reply-voice-test-v02.a0982227546.workers.dev";
const chat=document.getElementById("chat"),inp=document.getElementById("inp"),sendBtn=document.getElementById("send"),statusEl=document.getElementById("status"),theme=document.getElementById("theme");
const contextDebug=document.getElementById("contextDebug");
// Full chat history persistence test v0.1 — local device storage only.
// v05 changes only which already-stored chat range is sent as conversation. Reply Worker / Semantic / Scene / long-term-memory code is untouched.
const CHAT_STORAGE_KEY="peisu_full_chat_history_v01"; // keep v01 key so the already-PASS history remains available
// Push→chat history integration TEST v01.
// Keeps the existing CHAT_STORAGE_KEY unchanged so existing history is preserved.
// Uses a separate test Worker/inbox and does not touch production B scheduling/state.
const PUSH_HISTORY_SYNC_URL="https://peisu-push-history-test-v01.a0982227546.workers.dev";
const PUSH_HISTORY_SEEN_KEY="peisu_push_history_seen_v01";

function loadSeenPushIds(){
 try{
  const v=JSON.parse(localStorage.getItem(PUSH_HISTORY_SEEN_KEY)||"[]");
  return new Set(Array.isArray(v)?v:[]);
 }catch(e){return new Set()}
}
function saveSeenPushIds(ids){
 try{localStorage.setItem(PUSH_HISTORY_SEEN_KEY,JSON.stringify([...ids]))}catch(e){}
}
function pushLocalParts(sentAt){
 const d=new Date(sentAt);
 if(Number.isNaN(d.getTime())) return {date:localDateKey(),time:tm()};
 return {
  date:localDateKey(d),
  time:d.toLocaleTimeString("zh-TW",{hour:"2-digit",minute:"2-digit",hour12:false})
 };
}
async function syncProactivePushHistory(){
 try{
  const r=await fetch(PUSH_HISTORY_SYNC_URL+"/pending-messages",{cache:"no-store"});
  const data=await r.json();
  if(!r.ok) throw new Error(data?.error||`HTTP ${r.status}`);
  const items=Array.isArray(data?.messages)?data.messages:[];
  if(!items.length)return;
  const seen=loadSeenPushIds();
  let changed=false;
  for(const m of items){
   const id=String(m?.id||"");
   const text=typeof m?.body==="string"?m.body.trim():"";
   if(!id||!text||seen.has(id))continue;
   const p=pushLocalParts(m.sentAt);
   history.push({who:"裴溯",text,time:p.time,date:p.date,pushMessageId:id});
   seen.add(id);changed=true;
  }
  if(changed){
   saveSeenPushIds(seen);
   saveChatHistory();
   renderSavedChat();
  }
 }catch(e){
  console.warn("Push history sync failed:",e);
 }
}

let history=[];let busy=false;
function loadChatHistory(){
 try{
  const saved=JSON.parse(localStorage.getItem(CHAT_STORAGE_KEY)||"[]");
  history=Array.isArray(saved)?saved:[];
 }catch(e){history=[]}
}
function saveChatHistory(){
 try{localStorage.setItem(CHAT_STORAGE_KEY,JSON.stringify(history))}catch(e){}
}
function localDateKey(d=new Date()){
 const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,"0"),day=String(d.getDate()).padStart(2,"0");
 return `${y}-${m}-${day}`;
}
function dateLabel(key){
 const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(key||""));
 return m ? `${Number(m[2])}月${Number(m[3])}日` : String(key||"");
}
function ensureDates(){
 const today=localDateKey(); let changed=false;
 for(const x of history){if(!x.date){x.date=today;changed=true}}
 if(changed)saveChatHistory();
}
function addDateSeparator(date){
 const d=document.createElement("div");d.className="date-sep";d.textContent=dateLabel(date);chat.append(d);
}
function renderSavedChat(){
 chat.innerHTML="";
 ensureDates(); let lastDate=null;
 for(const x of history){
  if(x.date!==lastDate){addDateSeparator(x.date);lastDate=x.date}
  add(x.who,x.text,x.time,false);
 }
 chat.scrollTop=chat.scrollHeight;
}

function tm(){return new Date().toLocaleTimeString("zh-TW",{hour:"2-digit",minute:"2-digit",hour12:false})}
function add(who,text,time=tm(),autoScroll=true){
 const row=document.createElement("div");row.className="row "+(who==="裴溯"?"pei":"me");
 const group=document.createElement("div");group.className="group";
 const bubble=document.createElement("div");bubble.className="bubble";bubble.textContent=text;bubble.dataset.who=who;
 const meta=document.createElement("div");meta.className="meta";meta.textContent=time;
 group.append(bubble,meta);row.append(group);chat.append(row);if(autoScroll)chat.scrollTop=chat.scrollHeight;
}

// v04-A context-start detection test only.
// This does NOT change transcript() or the conversation sent to Reply.
function visibleContextStart(){
  const rows=[...chat.querySelectorAll(".row")];
  if(!rows.length)return null;
  const cr=chat.getBoundingClientRect();
  // v04c rule: when manually scrolled up, the LOWEST fully visible old bubble
  // at send time is the context start point.
  let lastFull=null;
  let lastPartial=null;
  for(const row of rows){
    const b=row.querySelector(".bubble");
    if(!b)continue;
    const r=b.getBoundingClientRect();
    if(r.bottom<=cr.top || r.top>=cr.bottom)continue;
    lastPartial=b;
    if(r.top>=cr.top && r.bottom<=cr.bottom)lastFull=b;
  }
  return lastFull||lastPartial;
}
function contextRangePreview(startBubble,newText){
  const rows=[...chat.querySelectorAll(".row")];
  const startRow=startBubble?.closest(".row");
  let idx=startRow?rows.indexOf(startRow):-1;
  if(idx<0)idx=Math.max(0,rows.length-1);
  const parts=rows.slice(idx).map(row=>{
    const b=row.querySelector(".bubble");
    if(!b)return null;
    return `${b.dataset.who||""}：${b.textContent}`;
  }).filter(Boolean);
  parts.push(`使用者：${newText}`);
  return parts;
}
function showContextDebug(startBubble,newText){
  if(!contextDebug)return;
  const startText=startBubble?.textContent||"(找不到起點)";
  const parts=contextRangePreview(startBubble,newText);
  contextDebug.hidden=false;
  contextDebug.textContent=`【正式版】\n起點：${startText}\n範圍：\n${parts.join("\n")}`;
}

function transcript(){return history.filter(x=>!x.dateTest).map(x=>`${x.who}：${x.text}`).join("\n")}

function manualContextTranscript(startBubble,newText){
  const rows=[...chat.querySelectorAll(".row")];
  const startRow=startBubble?.closest(".row");
  const idx=startRow?rows.indexOf(startRow):-1;
  if(idx<0)return transcript();
  const parts=rows.slice(idx).map(row=>{
    const b=row.querySelector(".bubble");
    if(!b)return null;
    return `${b.dataset.who||""}：${b.textContent}`;
  }).filter(Boolean);
  const historyBlock=parts.join("\n");
  return [
    "【回溯參考說明】",
    "以下內容是依實際發生順序排列的既有聊天紀錄。第一則只是使用者指定的回溯參考起點，不是目前對話時間點，也不是要求從該處重新開始對話或重新做決定。",
    "請把整段紀錄視為一路發生到現在的同一條時間線；若後面的訊息已更新、改變或確定較早的狀態，應以較新的狀態為準。",
    "",
    historyBlock,
    "",
    "【以上為既有聊天紀錄；以下才是使用者現在新送出的訊息】",
    `使用者：${newText}`
  ].join("\n");
}

async function send(){
 const raw=inp.value.trim();if(!raw||busy)return;
 const bottomGap=chat.scrollHeight-chat.scrollTop-chat.clientHeight;
 const wasAtBottom=bottomGap<=24;
 const frozenContextStart=wasAtBottom?null:visibleContextStart();
 const outgoingConversation=wasAtBottom
   ? [transcript(),`使用者：${raw}`].filter(Boolean).join("\n")
   : manualContextTranscript(frozenContextStart,raw);
 if(contextDebug){
   if(wasAtBottom){
     contextDebug.hidden=false;
     contextDebug.textContent="【正式版】\n模式：正常近期 context\n（目前在聊天室底部，未啟動手動上滑起點）";
   }else{
     showContextDebug(frozenContextStart,raw);
     contextDebug.textContent=contextDebug.textContent.replace("【正式版】","【正式版】\n模式：手動上滑 context");
   }
 }
 busy=true;sendBtn.disabled=true;inp.value="";
 const userTime=tm(),userDate=localDateKey();history.push({who:"使用者",text:raw,time:userTime,date:userDate});saveChatHistory();renderSavedChat();statusEl.textContent="裴溯正在回覆…";
 try{
  const r=await fetch(WORKER_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({conversation:outgoingConversation})});
  const data=await r.json();
  if(!r.ok)throw new Error(data?.error||`HTTP ${r.status}`);
  const reply=data?.integrated_reply?.reply;
  if(!reply)throw new Error("找不到回覆內容");
  if(reply.mode!=="silent"&&typeof reply.text==="string"&&reply.text.trim()){
   const t=reply.text.trim(),replyTime=tm(),replyDate=localDateKey();history.push({who:"裴溯",text:t,time:replyTime,date:replyDate});saveChatHistory();renderSavedChat();
  }
  statusEl.textContent="";
 }catch(e){statusEl.textContent="連線失敗："+(e?.message||e)}
 busy=false;sendBtn.disabled=false;
}
loadChatHistory();
if(history.some(x=>x.dateTest)){history=history.filter(x=>!x.dateTest);saveChatHistory();}
renderSavedChat();
syncProactivePushHistory();
document.addEventListener("visibilitychange",()=>{
 if(document.visibilityState==="visible")syncProactivePushHistory();
});
window.addEventListener("focus",()=>syncProactivePushHistory());

sendBtn.onclick=send;
theme.onclick=()=>{
 const light=document.body.classList.toggle("light");
 theme.textContent=light?"黑":"白";
 document.querySelector('meta[name="theme-color"]').setAttribute("content",light?"#fff":"#11161e");
};

// Persistent-memory UI test v1.0.
// Uses only the already-deployed Reply Worker memory API: add / list / remove.
// Semantic / Scene / normal Reply generation above are untouched.
const more=document.getElementById("more");
const topMenu=document.getElementById("topMenu");
const openMemory=document.getElementById("openMemory");
const openHistory=document.getElementById("openHistory");
const historyView=document.getElementById("historyView");
const closeHistory=document.getElementById("closeHistory");
const historyList=document.getElementById("historyList");
const testNextDay=document.getElementById("testNextDay");
const clearDateTest=document.getElementById("clearDateTest");
const msgMenu=document.getElementById("msgMenu");
const copyMsg=document.getElementById("copyMsg");
const toggleMemory=document.getElementById("toggleMemory");
const memoryView=document.getElementById("memoryView");
const closeMemory=document.getElementById("closeMemory");
const memoryList=document.getElementById("memoryList");

let selectedBubble=null;
let memoryItems=[];

function hideMenus(){topMenu.hidden=true;msgMenu.hidden=true}
function placeMenu(m,x,y){
 m.hidden=false;
 const r=m.getBoundingClientRect();
 m.style.left=Math.max(8,Math.min(x,innerWidth-r.width-8))+"px";
 m.style.top=Math.max(8,Math.min(y,innerHeight-r.height-8))+"px";
}
function sameMemory(b,m){
 return m && m.text===b.textContent && (!m.speaker || m.speaker===(b.dataset.who||""));
}
function memoryForBubble(b){return memoryItems.find(m=>sameMemory(b,m))||null}

async function memoryRequest(payload){
 const r=await fetch(WORKER_URL,{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify(payload)
 });
 const raw=await r.text();
 let data;try{data=JSON.parse(raw)}catch{throw new Error("回傳格式錯誤")}
 if(!r.ok||data?.status!=="completed")throw new Error(data?.error||("HTTP "+r.status));
 return data;
}
async function loadMemories(){
 const data=await memoryRequest({memory_action:"list"});
 memoryItems=Array.isArray(data.memories)?data.memories:[];
 return memoryItems;
}
function fmtMemoryTime(iso){
 const d=new Date(iso);
 return Number.isNaN(d.getTime()) ? String(iso||"") :
   d.toLocaleString("zh-TW",{year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hour12:false});
}
async function removeMemory(item){
 if(!item?.id)return;
 await memoryRequest({memory_action:"remove",id:item.id});
 memoryItems=memoryItems.filter(x=>x.id!==item.id);
}
async function renderMemory(){
 memoryList.innerHTML="";
 try{
   await loadMemories();
   if(!memoryItems.length){
     const d=document.createElement("div");d.className="memory-empty";
     d.textContent="還沒有加入長期記憶的訊息。";memoryList.append(d);return;
   }
   for(const item of memoryItems){
     const d=document.createElement("div");d.className="memory-item";
     const t=document.createElement("div");t.className="memory-time";
     t.textContent=fmtMemoryTime(item.created_at)+(item.speaker?" · "+item.speaker:"");
     const b=document.createElement("div");b.textContent=item.text;
     const rm=document.createElement("button");rm.className="memory-remove";rm.textContent="取消長期記憶";
     rm.onclick=async()=>{
       rm.disabled=true;rm.textContent="取消中…";
       try{
         await removeMemory(item);
         statusEl.textContent="已取消長期記憶";
         await renderMemory();
       }catch(e){
         statusEl.textContent="取消長期記憶失敗："+(e?.message||String(e));
         rm.disabled=false;rm.textContent="取消長期記憶";
       }
     };
     d.append(t,b,rm);memoryList.append(d);
   }
 }catch(e){
   const d=document.createElement("div");d.className="memory-empty";
   d.textContent="長期記憶讀取失敗："+(e?.message||String(e));memoryList.append(d);
 }
}

async function openMsg(b,x,y){
 selectedBubble=b;
 try{await loadMemories()}catch(e){}
 toggleMemory.textContent=memoryForBubble(b)?"取消長期記憶":"加入長期記憶";
 toggleMemory.disabled=false;
 topMenu.hidden=true;
 placeMenu(msgMenu,x,y);
}
let pt=null,sx=0,sy=0;
chat.addEventListener("pointerdown",e=>{
 const b=e.target.closest(".bubble");if(!b)return;
 sx=e.clientX;sy=e.clientY;
 pt=setTimeout(()=>{pt=null;openMsg(b,sx,sy)},520);
});
chat.addEventListener("pointermove",e=>{
 if(pt&&(Math.abs(e.clientX-sx)>10||Math.abs(e.clientY-sy)>10)){clearTimeout(pt);pt=null}
});
["pointerup","pointercancel"].forEach(n=>chat.addEventListener(n,()=>{if(pt)clearTimeout(pt);pt=null}));

copyMsg.onclick=async()=>{
 if(!selectedBubble)return;
 try{await navigator.clipboard.writeText(selectedBubble.textContent)}catch(e){}
 hideMenus();
};
toggleMemory.onclick=async()=>{
 if(!selectedBubble||toggleMemory.disabled)return;
 const bubble=selectedBubble;
 toggleMemory.disabled=true;
 const existing=memoryForBubble(bubble);
 toggleMemory.textContent=existing?"取消中…":"加入中…";
 try{
   if(existing){
     await removeMemory(existing);
     statusEl.textContent="已取消長期記憶";
   }else{
     const data=await memoryRequest({
       memory_action:"add",
       text:bubble.textContent,
       speaker:bubble.dataset.who||""
     });
     if(!data?.memory?.id)throw new Error("找不到新增的記憶 ID");
     memoryItems.push(data.memory);
     memoryItems.sort((a,b)=>String(a.created_at||"").localeCompare(String(b.created_at||"")));
     statusEl.textContent="已加入長期記憶";
   }
   hideMenus();
 }catch(e){
   statusEl.textContent=(existing?"取消":"加入")+"長期記憶失敗："+(e?.message||String(e));
   toggleMemory.disabled=false;
   toggleMemory.textContent=existing?"取消長期記憶":"加入長期記憶";
 }
};

more.onclick=e=>{
 e.stopPropagation();msgMenu.hidden=true;
 if(topMenu.hidden){
   const r=more.getBoundingClientRect();
   placeMenu(topMenu,Math.max(8,r.right-150),r.bottom+6);
 }else topMenu.hidden=true;
};

// Date separator test v0.2 — test entries are local-only and never sent to Reply Worker.
testNextDay.onclick=()=>{
 hideMenus();
 const d=new Date();d.setDate(d.getDate()+1);
 history.push({who:"使用者",text:"【跨日顯示測試】",time:"08:15",date:localDateKey(d),dateTest:true});
 saveChatHistory();renderSavedChat();statusEl.textContent="已加入明日測試訊息（不會送給裴溯）";
};
clearDateTest.onclick=()=>{
 hideMenus();history=history.filter(x=>!x.dateTest);saveChatHistory();renderSavedChat();statusEl.textContent="已移除跨日測試訊息";
};

// Chat-history management test v0.3 — grouped by local calendar date.
// Deleting a day changes CHAT_STORAGE_KEY only; long-term memory API/data is untouched.
function renderHistoryManager(){
 historyList.innerHTML="";
 ensureDates();
 if(!history.length){
  const e=document.createElement("div");e.className="history-empty";e.textContent="目前沒有聊天紀錄。";historyList.append(e);return;
 }
 const groups=new Map();
 for(const x of history){if(!groups.has(x.date))groups.set(x.date,[]);groups.get(x.date).push(x)}
 for(const [date,items] of groups){
  const day=document.createElement("section");day.className="history-day";
  const head=document.createElement("div");head.className="history-day-head";
  const title=document.createElement("div");title.className="history-day-title";title.textContent=dateLabel(date);
  const del=document.createElement("button");del.className="history-delete";del.textContent="刪除這天紀錄";
  del.onclick=()=>{
   history=history.filter(x=>x.date!==date);
   saveChatHistory();renderSavedChat();renderHistoryManager();
   statusEl.textContent="已刪除 "+dateLabel(date)+" 的聊天紀錄";
  };
  head.append(title,del);day.append(head);
  for(const x of items){
   const line=document.createElement("div");line.className="history-line";
   const time=document.createElement("span");time.className="history-line-time";time.textContent=x.time||"";
   const body=document.createElement("span");body.textContent=(x.who||"")+"："+(x.text||"");
   line.append(time,body);day.append(line);
  }
  historyList.append(day);
 }
}
openHistory.onclick=()=>{hideMenus();historyView.hidden=false;renderHistoryManager()};
closeHistory.onclick=()=>{historyView.hidden=true};

openMemory.onclick=async()=>{
 hideMenus();memoryView.hidden=false;await renderMemory();
};
closeMemory.onclick=()=>{memoryView.hidden=true};
document.addEventListener("click",e=>{
 if(!e.target.closest(".menu")&&!e.target.closest("#more"))hideMenus();
});
</script>
