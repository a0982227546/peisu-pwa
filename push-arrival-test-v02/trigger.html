<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>裴溯 Push 抵達測試 v02</title>
<style>body{font-family:system-ui,sans-serif;max-width:560px;margin:40px auto;padding:20px;background:#111;color:#eee}button{font:inherit;padding:12px 16px;border-radius:10px;border:1px solid #777;background:#222;color:#fff}#s{margin-top:16px;white-space:pre-wrap;line-height:1.5}</style>
<h2>Push 抵達解鎖測試 v02</h2><p>先開過 candidate 測試頁一次，讓它建立獨立測試訂閱。再按下面按鈕。</p><button id="b">發送「師兄？」</button><div id="s">尚未發送。</div>
<script>
const API="https://peisu-push-history-test-v01.a0982227546.workers.dev";
b.onclick=async()=>{b.disabled=true;s.textContent="發送中…";try{const r=await fetch(API+"/send-arrival-test",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({body:"師兄？"})});const d=await r.json();s.textContent=r.ok?`發送成功。\n${d.sentAt}`:`失敗：${d.error||r.status}`;}catch(e){s.textContent="失敗："+e.message}finally{b.disabled=false}};
</script></html>
