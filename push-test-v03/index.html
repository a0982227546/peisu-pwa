<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Push v03｜關頁測試</title><style>body{margin:0;background:#0d1420;color:#f5f7fb;font-family:system-ui}main{max-width:680px;margin:auto;padding:34px}p{color:#b9c1cf;line-height:1.7}button{width:100%;margin-top:20px;padding:20px;border:0;border-radius:22px;font-size:19px;font-weight:700}#s{margin-top:26px;padding:20px;border-radius:20px;background:#17202d;white-space:pre-wrap}</style></head><body><main><h1>Push v03｜關閉頁面測試</h1><p>建立這個測試範圍的 Push 訂閱，並把它存進 Worker KV。成功後這頁就可以關掉。</p><button id="b">① 建立並儲存 Push 訂閱</button><div id="s">尚未執行。</div><script>
const W="https://peisu-push-v01.a0982227546.workers.dev",S=document.getElementById("s");
const u=k=>{let p="=".repeat((4-k.length%4)%4),r=atob((k+p).replace(/-/g,"+").replace(/_/g,"/"));return Uint8Array.from([...r].map(c=>c.charCodeAt(0)))};
b.onclick=async()=>{try{S.textContent="處理中…";let kr=await fetch(W+"/public-key"),kd=await kr.json();if(!kr.ok||!kd.publicKey)throw Error(kd.error||"Worker 沒有回傳公鑰");let reg=await navigator.serviceWorker.register("./sw.js",{scope:"./"});await navigator.serviceWorker.ready;if(await Notification.requestPermission()!=="granted")throw Error("通知權限不是允許");let sub=await reg.pushManager.getSubscription();if(sub){await sub.unsubscribe()}sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:u(kd.publicKey)});let r=await fetch(W+"/save-subscription",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({subscription:sub.toJSON()})}),d=await r.json();if(!r.ok||!d.saved)throw Error(d.error||"Worker 沒有確認儲存");S.textContent="訂閱已存進 Worker KV ✅\n現在可以把這個 v03 頁面關掉。"}catch(e){S.textContent="失敗 ❌\n"+e.message}};
</script></main></body></html>
